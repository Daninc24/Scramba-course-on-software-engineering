<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday gift site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
</head>

<body>
    <div id="main-container">

        <div id="header" class="container">
            <h1>Today is Daniel's Birthday</h1>
            <img id="profile-pic" src="images/IMG_1437 1.jpg" alt="my photo">
            <h2 id="bday-age">27 years old</h2>
            <h4 id="bday-date">07.08.2026</h4>
        </div>
        <div class="gift-section">
            <h2 class="gift-title">Here's how I am happy for you today</h2>
            <h3 class="gift-hint">(Hover over the gift)</h3>
            <div class="gift-img">

            </div>
    
        </div>
    </div>

</body>

</html>
